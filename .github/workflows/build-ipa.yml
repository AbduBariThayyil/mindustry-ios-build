name: Build Mindustry iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Mindustry v159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Resolve the Arc commit Mindustry was built against
        id: arc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(grep '^archash=' Mindustry/gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          full=$(gh api "repos/Anuken/Arc/commits/$short" --jq .sha)
          echo "hash=$full" >> "$GITHUB_OUTPUT"

      - name: Checkout matching Arc (must sit next to Mindustry)
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          ref: ${{ steps.arc.outputs.hash }}
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check for an iOS native-build task in arc-core (diagnostic, fast)
        working-directory: Arc
        run: |
          chmod +x ./gradlew
          ./gradlew :arc-core:tasks --all 2>&1 | grep -i ios || echo "(no ios-related task found in arc-core)"

      - name: Fetch MetalANGLE natives (not checked into Arc, must be downloaded)
        working-directory: Arc
        run: |
          chmod +x ./gradlew
          ./gradlew :backends:backend-robovm:extractMetalANGLEKit --stacktrace

      - name: Patch ios build for CI
        working-directory: Mindustry
        run: |
          echo "--- patching ios/build.gradle ---"
          sed -i '' 's/iosSkipSigning = false/iosSkipSigning = true/' ios/build.gradle
          perl -0777 -pi -e 's#(into "libs")#duplicatesStrategy = DuplicatesStrategy.INCLUDE\n            $1#' ios/build.gradle
          grep -n "duplicatesStrategy\|iosSkipSigning" ios/build.gradle
          echo "--- removing stale 'arc' framework reference (nothing in this checkout produces arc.framework) ---"
          sed -i '' '/<framework>arc<\/framework>/d' ios/robovm.xml
          grep -n "framework" ios/robovm.xml

      - name: Build the IPA
        working-directory: Mindustry
        run: |
          chmod +x ./gradlew
          ./gradlew ios:deploy -Pbuildversion=159.7 --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-159.7-ios
          path: Mindustry/ios/build/robovm/*.ipa
