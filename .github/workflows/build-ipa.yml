name: Build Mindustry iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Mindustry v159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Resolve the Arc commit Mindustry was built against
        id: arc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(grep '^archash=' Mindustry/gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          full=$(gh api "repos/Anuken/Arc/commits/$short" --jq .sha)
          echo "hash=$full" >> "$GITHUB_OUTPUT"

      - name: Checkout matching Arc (must sit next to Mindustry)
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          ref: ${{ steps.arc.outputs.hash }}
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and package Arc's iOS native library
        working-directory: Arc
        run: |
          chmod +x ./gradlew
          echo "--- building iOS natives ---"
          ./gradlew :arc-core:jnigenBuildAllIOS --stacktrace
          echo "--- packaging iOS natives ---"
          ./gradlew :arc-core:jnigenPackageAllIOS --stacktrace
          echo "--- searching the whole checkout for output ---"
          find .. -iname "*.framework" -o -iname "*arc*.a" -o -iname "*.xcframework" 2>/dev/null
