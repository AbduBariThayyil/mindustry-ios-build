name: Build Mindustry iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Mindustry v159.7
        uses: actions/checkout@v7
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Resolve the Arc commit Mindustry was built against
        id: arc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(grep '^archash=' Mindustry/gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "short hash: $short"
          full=$(gh api "repos/Anuken/Arc/commits/$short" --jq .sha)
          echo "full sha: $full"
          echo "hash=$full" >> "$GITHUB_OUTPUT"

      - name: Checkout matching Arc (must sit next to Mindustry)
        uses: actions/checkout@v7
        with:
          repository: Anuken/Arc
          ref: ${{ steps.arc.outputs.hash }}
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --- TEMPORARY DIAGNOSTIC STEP ---
      # Arc's own .gitignore excludes backends/backend-robovm/res/META-INF/robovm/ios/libs/,
      # which is exactly where the linker expects MetalANGLEKit.framework to live. That folder
      # is populated by some Gradle task inside Arc (the same pattern libGDX's own robovm-metalangle
      # backend uses: a task that downloads a zip and unzips it into that path) - but a plain
      # checkout + ios:deploy never calls it. This step lists Arc's backend-robovm tasks so we can
      # find its real name, then stops on purpose so we're not burning ~9 more minutes on a build
      # we already know will fail the same way.
      - name: "DIAGNOSTIC: find Arc's iOS/Metal native-lib fetch task"
        working-directory: Arc
        run: |
          chmod +x ./gradlew
          ./gradlew backends:backend-robovm:tasks --all > /tmp/robovm-tasks.txt
          echo "----- full task list for :backends:backend-robovm -----"
          cat /tmp/robovm-tasks.txt
          echo ""
          echo "----- likely candidates -----"
          grep -iE "ios|metal|download|fetch|extract|native" /tmp/robovm-tasks.txt || echo "(nothing obvious matched - scan the full list above by eye)"
          echo ""
          echo "Whichever task fetches/extracts the iOS libs: add it as its own step (working-directory: Arc) right before 'Build the IPA', then delete this diagnostic step."
          exit 1
      # --- END TEMPORARY DIAGNOSTIC STEP ---

      - name: Allow an unsigned build (no Apple cert on this runner)
        working-directory: Mindustry
        run: sed -i '' 's/iosSkipSigning = false/iosSkipSigning = true/' ios/build.gradle

      - name: Build the IPA
        working-directory: Mindustry
        run: |
          chmod +x ./gradlew
          ./gradlew ios:deploy -Pbuildversion=159.7 --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-159.7-ios
          path: Mindustry/ios/build/robovm/*.ipa
